name: Release

# Bump VERSION on main and this cuts a signed, notarized release through the
# shared shaferllc Mac release (shaferllc/.github). Run it by hand from the
# Actions tab for a dry run: build, sign, notarize and verify, publish nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run — build, sign and notarize without publishing
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    uses: shaferllc/.github/.github/workflows/mac-release.yml@main
    with:
      app: Almanac
      notes: >-
        Almanac lives in the menu bar and drops a perfectly formatted date into whatever you're typing — one hotkey, any format, any time zone. It's in the spirit of DateDrop: press ⌥⌘D and today's date lands at your cursor, already shaped the way that document, commit message, or log entry wants it.
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
